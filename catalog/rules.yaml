# Flag rules (BACKEND.md §7.1) and scoring weights (§8.3). Thresholds live here, not in code.
# Bump `version` when a rule's meaning changes: flags store rule_id + rule_version so FP-rate shifts trace to edits.
#
# app_categories: where candidate apps come from (what we'd recommend).
# required_functions / helpful_functions / keywords (ENGINE-V2 §1.2, 23 Nov 2026): engine v2 ranking inputs only.
#                 Functions are Xero's object names from the listing's data-flow section; keywords are matched against
#                 the app's description (BM25). Never used for flagging.
# covered_by:     categories that, if the business already pays for an app in them, mean the line is handled
#                 ("covered"). Defaults to app_categories. An in-use app that is only in app_categories helps
#                 but doesn't handle it → flagged with coverage gap 0.5.
# v2 (2026-11-04): coverage rule v2 for every rule — in-use apps in covered_by now cover the line even when
#                  another app ranks higher (that becomes a "could switch" note, not a flag).

scoring:
  # v1.1 K (9 Nov 2026): was 0.40 / 0.25 / 0.20 / 0.15. Price still shows in full on every option.
  weights: { strength: 0.50, fit_with_in_use: 0.35, peer_results: 0.10, price_fit: 0.05 }
  fit: { native: 1.0, via_app: 0.8, csv: 0.6, none: 0.3, no_apps: 0.5 }
  neutral: 0.5

# Engine v2 (ENGINE-V2.md §1.1, 22 Nov 2026). Ranking only: never changes whether a line is flagged.
#   match   = 100 × (strength × 0.50 + fit × 0.35 + quality × 0.10 + price × 0.05)
#   fit     = integration_fit × 0.60 + job_fit × 0.40
#   job_fit = category_match × 0.40 + function_match × 0.35 + keyword_match × 0.25
#   quality = clamp(rating_score × 0.85 + volume_score × 0.15 + award_boost, 0, 1)
# A missing input scores `neutral` and is shown as missing. Shown to admins at /admin/engine-v2.
scoring_v2:
  status: { weights: "DECIDED 9 Nov 2026", sub_weights: "APPROVED by the owner 23 Nov 2026" }
  weights: { strength: 0.50, fit: 0.35, quality: 0.10, price: 0.05 }
  fit: { integration_fit: 0.60, job_fit: 0.40 }
  job_fit: { category_match: 0.40, function_match: 0.35, keyword_match: 0.25 }
  category_match: { covered_by: 1.0, app_categories_only: 0.7 }   # else 0 and not a candidate
  function_match: { helpful_factor: 0.5 }                         # share of required + 0.5 × share of helpful, capped at 1
  quality: { rating_score: 0.85, volume_score: 0.15 }
  rating_prior_count: 20                                          # Bayesian prior, at the category's mean rating
  award_boost: { winner: 0.10, finalist: 0.05, half_life_years: 1, cap: 0.15 }   # region-unknown awards count as global (owner 23 Nov)
  price: { price_share_good: 0.002, price_share_bad: 0.02 }       # annual cost as a share of annual revenue; prices in £ (converted, owner 23 Nov)
  integration_fit: { native: 1.0, via_app: 0.8, csv: 0.6, none: 0.3, no_apps: 0.5 }
  neutral: 0.5

rules:
  - id: payroll_no_bridge
    version: 2
    account_categories: [wages, employer_ni, pensions]
    app_categories: [payroll, rota]
    required_functions: [Manual Journals]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Employees, PayRuns, PayItems, Timesheets, Tracking Categories]
    keywords: [payroll, payslip, payslips, paye, rti, hmrc, pension, pensions, auto-enrolment, salary, salaries, wages, employees]
    covered_by: [payroll]          # a rota app feeds payroll but doesn't run it
    statements: [pl]
    min_value_gbp: 1000
    cause: "Payroll costs this size usually need a payroll app posting to Xero. Only your team can confirm how it's done today."

  - id: payroll_liabilities
    version: 2
    account_categories: [payroll_liabilities]
    app_categories: [payroll]
    required_functions: [Manual Journals]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Employees, PayRuns, PayItems, Timesheets, Tracking Categories]
    keywords: [payroll, payslip, payslips, paye, rti, hmrc, pension, pensions, auto-enrolment, salary, salaries, wages, employees]
    statements: [bs, cf]
    min_value_gbp: 1000
    cause: "PAYE, NI and pension balances usually come from a payroll app's journal. Check how these reach Xero."

  - id: cost_of_sales_stock
    version: 2
    account_categories: [cost_of_sales, inventory]
    app_categories: [inventory, data_capture]
    required_functions: [Items, Purchase Orders]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Invoices, Credit Notes, Contacts, Tracking Categories]
    keywords: [inventory, stock, warehouse, purchase, purchasing, cogs, sku, skus, landed, reorder, manufacturing]
    covered_by: [inventory]        # bill capture records purchases but doesn't cost stock
    statements: [pl, bs, cf]
    min_value_gbp: 5000
    cause: "Purchases this size are usually captured and costed by an inventory or bill-capture app."

  - id: supplier_bills
    version: 2
    account_categories: [trade_creditors, utilities, repairs, cleaning, freight]
    app_categories: [data_capture, spend_payables]
    required_functions: [Invoices]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Contacts, Payments, Purchase Orders, Tracking Categories]
    keywords: [bills, invoices, receipts, ocr, extraction, extract, payable, payables, approval, approvals, supplier, suppliers, capture]
    statements: [pl, bs, cf]
    min_value_gbp: 2000
    cause: "Bills at this volume are usually captured by an app rather than keyed by hand."

  - id: receivables
    version: 2
    account_categories: [trade_debtors]
    app_categories: [billing_receivables]
    required_functions: [Invoices, Payments]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Contacts, Credit Notes, Overpayments]
    keywords: [debtors, receivables, chase, chasing, overdue, credit, collections, reminders, late, paid, dso, cash]
    statements: [bs, cf]
    min_value_gbp: 5000
    cause: "Money owed by customers at this level is usually chased by a collections app."

  - id: sales_capture
    version: 2
    account_categories: [sales]
    app_categories: [epos_ecommerce, billing_receivables]
    required_functions: [Invoices]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Payments, Items, Contacts, Bank Transactions]
    keywords: [sales, orders, ecommerce, shopify, amazon, pos, payouts, settlement, settlements, marketplace, marketplaces, checkout]
    statements: [pl]
    min_value_gbp: 10000
    cause: "Sales this size usually flow into Xero from an EPOS, ecommerce or invoicing app."

  - id: card_spend
    version: 2
    account_categories: [travel, entertainment, office_general, software_subscriptions, motor, advertising]
    app_categories: [spend_payables]
    required_functions: [Bank Transactions]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Receipts, Contacts, Tracking Categories, Invoices]
    keywords: [expenses, expense, cards, card, receipts, spend, spending, reimbursement, mileage, claims]
    statements: [pl]
    min_value_gbp: 2000
    cause: "Card and expense spend is usually captured by a spend app with receipts attached."

  - id: fx_costs
    version: 2
    account_categories: [fx_gains_losses]
    app_categories: [fx_banking]
    required_functions: [Bank Transactions, Currencies]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Payments, Bank Transfers]
    keywords: [fx, currency, currencies, international, exchange, multi-currency, transfers, overseas]
    statements: [pl]
    min_value_gbp: 500
    cause: "Currency gains and losses point to foreign payments that an FX account can make cheaper."

  # Trend rules (v1.1 B): line keys trend:<key>, base = revenue. Covered by an app in covered_by, as for lines.
  - id: trend_debtor_days
    version: 1
    account_categories: [trend:debtor_days]
    app_categories: [billing_receivables]
    required_functions: [Invoices, Payments]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Contacts, Credit Notes, Overpayments]
    keywords: [debtors, receivables, chase, chasing, overdue, credit, collections, reminders, late, paid, dso, cash]
    statements: [trend]
    cause: "Customers are taking longer to pay than three months ago. A chasing app usually brings this back down."
  - id: trend_creditor_days
    version: 1
    account_categories: [trend:creditor_days]
    app_categories: [spend_payables]
    required_functions: [Invoices, Payments]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Contacts, Bank Transactions]
    keywords: [suppliers, payables, payments, pay, batch, approvals, bills, runs]
    statements: [trend]
    cause: "You're taking longer to pay suppliers than three months ago. Worth checking bills aren't stuck waiting for approval."
  - id: trend_stock_days
    version: 1
    account_categories: [trend:stock_days]
    app_categories: [inventory]
    required_functions: [Items, Purchase Orders]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Invoices, Credit Notes, Contacts, Tracking Categories]
    keywords: [inventory, stock, warehouse, purchase, purchasing, cogs, sku, skus, landed, reorder, manufacturing]
    statements: [trend]
    cause: "Stock is sitting longer than three months ago. An inventory app shows what's slow-moving."
  - id: trend_cash_headroom
    version: 1
    account_categories: [trend:cash_headroom_months]
    app_categories: [cash_forecasting]
    required_functions: [Reports, Bank Transactions]   # v2: Xero objects (catalog/xero-functions.yaml) an app must list
    helpful_functions: [Invoices, Accounts, Budgets]
    keywords: [cash, forecast, forecasting, scenario, scenarios, runway, budget, budgets, cashflow]
    statements: [trend]
    cause: "At the current rate cash runs out sooner than it did three months ago. A cash flow forecast shows when and why."

  - id: fine_as_is
    version: 3          # v3 (13 Nov 2026): + control_clearing
    account_categories:
      [rent, depreciation, interest, corporation_tax, bank_charges, insurance, professional_fees, telephone_internet,
       bank, prepayments, fixed_assets, vat, corporation_tax_payable, accruals, short_term_loans, long_term_loans,
       directors_loan, share_capital, retained_earnings, dividends, other_equity, other_income, staff_other, control_clearing,
       contractors, card_fees, bad_debts, other_debtors]
    app_categories: []

# ---------------- Trends (v1.1 B, BACKEND.md §7.3) ----------------
# A trend fires when the latest value is past `threshold` AND it moved the wrong way by `min_change` over 3 months.
# Thresholds are PROPOSED starting points (owner to tune with real ledgers); they live here, not in code.
trends:
  debtor_days: { threshold: 45, min_change: 7 }
  creditor_days: { threshold: 60, min_change: 7 }
  stock_days: { threshold: 60, min_change: 7 }
  cash_headroom_months: { threshold: 6, min_change: 1 }

# ---------------- Lifecycle (round-2 decision 3a, 10 Nov 2026: DECIDED) ----------------
# Expected = last payment date + billing cycle. Missed only when BOTH today and books_through are at least
# leeway_days past the expected date (books entered late never look like a cancelled app).
# One miss → lapsing (ask "Do you still use it?", still counts as cover); a second miss, unanswered → inactive.
lifecycle:
  leeway_days: 7

# ---------------- One-off detection (round-2 decision 3c, 10 Nov 2026) ----------------
# With at least min_months of monthly P&L, a line where one month holds >= concentration of the year-to-date value
# drops one band and says "Most of this year's total is in one month (<month>). It may be a one-off."
one_off:
  concentration: 0.6
  min_months: 3
