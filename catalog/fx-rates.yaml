# Exchange rates used to show vendor prices in pounds (owner decision 23 Nov 2026: "convert and write as pounds, the UK
# is the main customer"). European Central Bank euro foreign exchange reference rates (units of currency per 1 EUR).
# Source: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml, rates for 2026-11-20, fetched 2026-11-23.
