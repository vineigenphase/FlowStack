# App catalogue (BACKEND.md §8.1). Hand-entered. Every entry is `sample: true` until a person verifies it.
# source: where the entry's facts came from (vendor site, typed by hand). PRs touching this file note the source of each fact.
#
# fingerprints: normalised supplier names (lib/detect/normalise.ts).
#   "deputy"     exact match on the whole normalised name
#   "pleo *"     token-prefix match: "pleo technologies" matches; use only for distinctive names
# integrations: native | via_app | csv. "xero" is the ledger itself.

- id: xero
  name: Xero
  categories: [accounting]
  markets: [UK, US, CA, AU]
  website: https://www.xero.com
  fingerprints: ["xero", "xero *"]
  sample: true
  source: hand-entered

